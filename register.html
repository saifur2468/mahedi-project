<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - English জানো</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4338e8",
              blueText: "#0ea5e9",
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-white min-h-screen">
    <!-- account তৈরির form ও প্রয়োজনীয় তথ্য লেখার ঘর -->
    <main class="w-full flex justify-center px-4 pt-4 pb-5">
      <div class="w-full max-w-[445px]">
        <div class="text-center mb-5">
          <h1 class="text-[27px] md:text-[30px] font-bold text-[#111827]">
            <span class="text-sky-500">Create</span> Your Account
          </h1>
          <p class="mt-1 text-[14px] md:text-[15px] text-slate-500">
            অ্যাকাউন্ট তৈরি করে ইংরেজি শেখা শুরু করুন।
          </p>
        </div>

        <div
          class="border border-slate-200 rounded-md bg-white px-5 py-4 shadow-sm"
        >
          <form
            id="registerForm"
            action="/api/register"
            method="post"
            novalidate
          >
            <div class="mb-4">
              <label
                for="fullName"
                class="block mb-1.5 text-[13px] font-semibold text-[#243b63]"
                >Full Name</label
              >
              <input
                id="fullName"
                name="fullName"
                type="text"
                autocomplete="name"
                placeholder="আপনার পুরো নাম লিখুন"
                required
                class="w-full h-[38px] rounded-md border border-slate-300 px-3 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
              />
            </div>

            <div class="mb-4">
              <label
                for="email"
                class="block mb-1.5 text-[13px] font-semibold text-[#243b63]"
                >Email Address</label
              >
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="আপনার ইমেইল লিখুন"
                required
                class="w-full h-[38px] rounded-md border border-slate-300 px-3 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
              />
            </div>

            <div class="mb-4">
              <label
                for="username"
                class="block mb-1.5 text-[13px] font-semibold text-[#243b63]"
                >Username or Email Address</label
              >
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="ইউজারনেম বা ইমেইল লিখুন"
                required
                class="w-full h-[38px] rounded-md border border-slate-300 px-3 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
              />
            </div>

            <div class="mb-4">
              <label
                for="password"
                class="block mb-1.5 text-[13px] font-semibold text-[#243b63]"
                >Password</label
              >
              <div class="relative">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  aria-describedby="password-rules register-message"
                  placeholder="কমপক্ষে ৮ অক্ষরের password"
                  required
                  class="w-full h-[38px] rounded-md border border-slate-300 px-3 pr-10 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
                />
                <button
                  type="button"
                  data-password-target="password"
                  onclick="window.EnglishSikhoAuth.togglePasswordVisibility(this)"
                  aria-label="Show password"
                  aria-pressed="false"
                  class="absolute right-0 top-1/2 z-10 grid size-10 -translate-y-1/2 place-items-center rounded text-slate-500 transition hover:text-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"
                >
                  <svg
                    data-eye-open
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    data-eye-closed
                    class="hidden h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path
                      d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.5-.8"
                    />
                  </svg>
                </button>
              </div>
              <ul
                id="password-rules"
                class="mt-2 space-y-1 text-[11px] text-slate-500"
              >
                <li>কমপক্ষে ৮টি character</li>
                <li>১টি uppercase, ১টি lowercase ও ১টি number</li>
                <li>১টি special character; space দেওয়া যাবে না</li>
              </ul>
            </div>

            <div class="mb-4">
              <label
                for="confirmPassword"
                class="block mb-1.5 text-[13px] font-semibold text-[#243b63]"
                >Confirm Password</label
              >
              <div class="relative">
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  aria-describedby="register-message"
                  placeholder="পাসওয়ার্ডটি আবার লিখুন"
                  required
                  class="w-full h-[38px] rounded-md border border-slate-300 px-3 pr-10 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
                />
                <button
                  type="button"
                  data-password-target="confirmPassword"
                  onclick="window.EnglishSikhoAuth.togglePasswordVisibility(this)"
                  aria-label="Show confirmation password"
                  aria-pressed="false"
                  class="absolute right-0 top-1/2 z-10 grid size-10 -translate-y-1/2 place-items-center rounded text-slate-500 transition hover:text-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
                >
                  <svg
                    data-eye-open
                    class="h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    data-eye-closed
                    class="hidden h-4 w-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path
                      d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.5-.8"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <button
              type="submit"
              class="w-full h-[38px] rounded-md bg-gradient-to-r from-indigo-700 to-purple-700 text-white text-[14px] font-semibold flex items-center justify-center shadow-sm hover:from-indigo-800 hover:to-purple-800 transition"
            >
              Create Account
            </button>

            <p
              id="register-message"
              class="mt-3 min-h-5 text-center text-[12px] text-rose-700"
              aria-live="polite"
            ></p>

            <p class="mt-4 text-center text-[12px] text-slate-500">
              Already have an account?
              <a
                href="login.html"
                class="font-semibold text-blue-600 hover:text-blue-800"
                >Login</a
              >
            </p>
          </form>
        </div>
      </div>
    </main>

    <!-- account নিবন্ধন ও password policy যাচাই -->
    <script src="./script/auth.js"></script>
    <script>
      const registerForm = document.getElementById("registerForm");
      const passwordInput = document.getElementById("password");
      const message = document.getElementById("register-message");

      if (!window.EnglishSikhoAuth?.isConfigured()) {
        message.textContent = window.EnglishSikhoAuth
          ? window.EnglishSikhoAuth.getConfigurationError()
          : "Registration চালু করা যায়নি। পেজটি Live Server বা HTTPS দিয়ে খুলুন।";
      } else {
        window.EnglishSikhoAuth.getCurrentAccount()
          .then((account) => {
            if (account) window.location.replace("index.html");
          })
          .catch((error) => {
            message.textContent = error.message;
          });
      }

      const { isPasswordValid, registerAccount } =
        window.EnglishSikhoAuth || {};

      const pendingIdentifier = new URLSearchParams(window.location.search).get(
        "identifier",
      );

      if (pendingIdentifier) {
        const identifierField = pendingIdentifier.includes("@")
          ? document.getElementById("email")
          : document.getElementById("username");
        identifierField.value = pendingIdentifier;
      }

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";

        if (!window.EnglishSikhoAuth?.isConfigured()) {
          message.textContent =
            window.EnglishSikhoAuth?.getConfigurationError() ||
            "Authentication script লোড হয়নি।";
          return;
        }

        if (!registerForm.checkValidity()) {
          const errorMessage = "সব তথ্য সঠিকভাবে পূরণ করুন।";
          message.textContent = errorMessage;
          alert(errorMessage);
          return;
        }

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const username = document.getElementById("username").value.trim();
        const password = passwordInput.value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const isUsername =
          /^[a-zA-Z0-9_]{3,30}$/.test(username) ||
          (username.length <= 254 &&
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username));
        if (!isUsername) {
          const errorMessage =
            "Username ৩-৩০ অক্ষরের ইংরেজি অক্ষর, সংখ্যা বা _ হতে হবে, অথবা email address দিন।";
          message.textContent = errorMessage;
          document.getElementById("username").focus();
          return;
        }

        if (!isPasswordValid(password)) {
          const errorMessage =
            "Password-এর নিয়ম: ৮+ character, uppercase, lowercase, number ও special character; space নয়।";
          message.textContent = errorMessage;
          alert(errorMessage);
          passwordInput.focus();
          return;
        }
        if (password !== confirmPassword) {
          const errorMessage = "দুটি password মিলছে না।";
          message.textContent = errorMessage;
          alert(errorMessage);
          document.getElementById("confirmPassword").focus();
          return;
        }

        const submitButton = registerForm.querySelector(
          "button[type='submit']",
        );
        submitButton.disabled = true;
        submitButton.textContent = "Creating account...";

        try {
          const result = await registerAccount({
            fullName,
            email,
            username,
            password,
          });
          if (!result.ok) {
            message.textContent =
              result.reason === "password"
                ? "Password-এর সব নিয়ম পূরণ করুন।"
                : "এই email বা username আগে থেকেই ব্যবহার করা হয়েছে।";
            alert(message.textContent);
            submitButton.disabled = false;
            submitButton.textContent = "Create Account";
            return;
          }
          window.location.replace("login.html?registered=1");
        } catch (error) {
          message.textContent =
            error.message || "Account তৈরি করা যায়নি। আবার চেষ্টা করুন।";
          alert(message.textContent);
          submitButton.disabled = false;
          submitButton.textContent = "Create Account";
        }
      });
    </script>
  </body>
</html>
